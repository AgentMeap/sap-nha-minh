<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sạp Nhà Mình Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: host = 16:9 illustrated stage + side panel (projector); player = phone column with a scene banner on top. Flat-vector market palette, single committed light look. */
:root{
  --bg:#DCEEEA;        /* mint stall-wall */
  --paper:#FFFFFF;
  --ink:#1D2B2A;
  --muted:#5A6B68;
  --teal:#0E7C6B;      /* stall green-teal */
  --red:#E2453C;       /* awning red */
  --yellow:#FFC93C;    /* price sign */
  --sky:#8FD3E8;
  --line:#BFD6D1;
  --good:#1F8A4C; --bad:#C2352B;
  --s-money:#E5A100; --s-drive:#F0643A; --s-clear:#2F7FD0; --s-common:#5B9A2A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:var(--body)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.btn{appearance:none;border:2.5px solid var(--ink);background:var(--teal);color:#fff;font-weight:700;font-size:1rem;padding:12px 16px;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.red{background:var(--red)} .btn.yel{background:var(--yellow);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.choice:focus-visible,.avbtn:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.chip{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sky)}
.stage>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.actor{position:absolute;bottom:3%;animation:bob 2.4s ease-in-out infinite;transform-origin:bottom center}
.actor svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.bubble{position:absolute;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:600;max-width:42%;font-size:clamp(.7rem,1.35vw,1.05rem);line-height:1.3}
.tag{position:absolute;left:3%;top:4%;background:var(--yellow);border:2.5px solid var(--ink);border-radius:10px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:clamp(.8rem,1.8vw,1.4rem);transform:rotate(-2deg)}
/* host */
.host{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hbar .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:clamp(1.4rem,2.4vw,2.2rem)}
.panel .q{font-size:clamp(1.05rem,1.7vw,1.5rem);font-weight:600;line-height:1.35}
.hopt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:clamp(.95rem,1.35vw,1.2rem);background:#fff}
.hopt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;border:2px solid var(--ink)}
.hopt.right{background:#DDF4E5;border-color:var(--good)}
.k0{background:var(--red)}.k1{background:var(--s-clear)}.k2{background:var(--yellow);color:var(--ink)!important}.k3{background:var(--s-common)}
.counter{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,2vw,1.8rem)}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring text{font-family:var(--display);font-weight:800;font-size:26px;fill:var(--ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:30px minmax(0,1fr) 52px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.barrow .track{height:30px;border:2px solid var(--ink);border-radius:8px;background:#F1F6F5;overflow:hidden}
.barrow .fill{height:100%;transition:width .8s}
.barrow .lbl{font-size:.85rem;color:var(--muted);grid-column:2/4}
.law{background:#FFF8E1;border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;font-size:clamp(.82rem,1.1vw,1rem);display:flex;flex-direction:column;gap:4px}
.lawb{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.law ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.law .ask{font-weight:700;color:var(--teal)}
.law summary{cursor:pointer;font-weight:700}
.theory{border-left:5px solid var(--teal);background:#E9F5F2;padding:8px 12px;border-radius:0 10px 10px 0;font-size:clamp(.88rem,1.2vw,1.05rem)}
.fact{background:var(--yellow);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.src{font-size:.78rem;color:#4b3d00}
.top5{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;background:#fff;font-variant-numeric:tabular-nums}
.trow .mini svg{width:40px;height:40px;display:block}
.trow .nm{font-weight:700;overflow-wrap:anywhere}
.crowd{position:absolute;left:2%;right:2%;bottom:2%;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-items:flex-end;gap:0 .6%}
.crowd .pl{width:6.2%;display:flex;flex-direction:column;align-items:center;animation:bob 2.6s ease-in-out infinite}
.crowd .pl.enter{animation:walkin .9s ease-out,bob 2.6s ease-in-out .9s infinite}
.crowd .pl svg{width:100%;height:auto;display:block}
.crowd .pl span{font-size:clamp(.45rem,.75vw,.75rem);font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:0 4px;max-width:160%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes walkin{from{transform:translateX(-60vw)}to{transform:translateX(0)}}
.qr{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px;align-self:center;width:min(100%,240px)}
.qr svg{width:100%;height:auto;display:block}
.link{font-size:.8rem;word-break:break-all;background:#F1F6F5;border-radius:8px;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace}
.podium{position:absolute;left:18%;right:18%;bottom:4%;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:2%}
.pcol{display:flex;flex-direction:column;align-items:center}
.pcol .who{width:62%;animation:bob 2s ease-in-out infinite}
.pcol .who svg{width:100%;height:auto;display:block}
.pcol .nm{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:clamp(.6rem,1.2vw,1.1rem);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .blk{width:100%;border:2.5px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3.4vw,3rem);color:var(--ink)}
.p1 .blk{height:clamp(60px,14vw,190px);background:var(--yellow)}.p2 .blk{height:clamp(44px,10vw,140px);background:#E3E9EE}.p3 .blk{height:clamp(32px,7.5vw,100px);background:#F1B98A}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-5%;width:1%;height:2.4%;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
.react{position:fixed;bottom:8%;font-size:2.6rem;pointer-events:none;animation:floatup 2.6s ease-out forwards;z-index:30}
@keyframes floatup{to{transform:translateY(-55vh);opacity:0}}
.confirm{background:#FDE7E4;border:2px solid var(--bad);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* player */
.player{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.player .stage .actor{width:24%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .lab{font-size:.66rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .bar{height:7px;background:#ffffff30;border-radius:4px;overflow:hidden}
.stat .bar i{display:block;height:100%;transition:width .6s}
.stat .num{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{appearance:none;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-size:1rem;font-weight:500;line-height:1.35;padding:12px;text-align:left;display:flex;gap:10px;align-items:flex-start;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;border:2px solid var(--ink)}
.choice.picked{background:#FFF3C8}
.choice[disabled]{cursor:default}
.choice.right{background:#DDF4E5;border-color:var(--good)} .choice.wrong{background:#FDE3E0;border-color:var(--bad)}
.ptimer{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avbtn{appearance:none;border:2.5px solid var(--line);border-radius:12px;background:#fff;padding:4px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:600;color:var(--ink)}
.avbtn svg{width:100%;height:auto;display:block}
.avbtn.on{border-color:var(--ink);background:#FFF3C8;box-shadow:0 3px 0 var(--ink)}
input[type=text]{font:500 1.05rem var(--body);padding:12px;border:2.5px solid var(--ink);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:999px;border:1.5px solid var(--ink)}
.delta.up{background:#DDF4E5;color:var(--good)}.delta.down{background:#FDE3E0;color:var(--bad)}
.reacts{display:flex;gap:8px;justify-content:center}
.reacts button{appearance:none;font-size:1.6rem;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px 12px;cursor:pointer}
.big{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;color:var(--red)}
.note{font-size:.88rem;color:var(--muted)}
.warn{background:#FDE7E4;border:2px solid var(--bad);border-radius:12px;padding:10px 12px;font-size:.92rem}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1.5px dashed var(--line);padding-bottom:4px;font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:74px;display:grid;place-items:center;padding:3px}
.cust{appearance:none;width:100%;height:100%;border:2.5px solid var(--ink);border-radius:10px;background:var(--yellow);font-weight:700;font-size:.78rem;line-height:1.2;cursor:pointer;animation:pop .2s}
.cust.done{background:#DDF4E5}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="player"><div class="card"><h2>Sạp Nhà Mình Live</h2><p class="note">Đang mở phòng chơi…</p></div></div></div>

<script>
(function(){
"use strict";
const params=new URLSearchParams(location.search); let ROOM=(params.get("room")||"").replace(/\D/g,"").slice(0,6);
const joinUrl=()=>location.origin+location.pathname+"?room="+ROOM;
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ================= ART: FLAT VECTOR ================= */
const SKIN=["#F2C9A0","#E3AE80","#C98F62","#F6D3B3"];
function face(expr){
  const E={
   happy:`<path d="M44 60 q5-6 10 0M66 60 q5-6 10 0" stroke="#1D2B2A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 74 q10 10 20 0" stroke="#1D2B2A" stroke-width="3" fill="#fff" stroke-linecap="round"/>`,
   neutral:`<circle cx="49" cy="60" r="3.2" fill="#1D2B2A"/><circle cx="71" cy="60" r="3.2" fill="#1D2B2A"/><path d="M53 76 h14" stroke="#1D2B2A" stroke-width="3" stroke-linecap="round"/>`,
   worried:`<circle cx="49" cy="61" r="3.2" fill="#1D2B2A"/><circle cx="71" cy="61" r="3.2" fill="#1D2B2A"/><path d="M42 52 l10-4M78 52 l-10-4" stroke="#1D2B2A" stroke-width="2.6" stroke-linecap="round"/><path d="M50 78 q5-5 10 0 q5 5 10 0" stroke="#1D2B2A" stroke-width="3" fill="none" stroke-linecap="round"/>`,
   shocked:`<circle cx="49" cy="60" r="5.5" fill="#fff" stroke="#1D2B2A" stroke-width="2.5"/><circle cx="71" cy="60" r="5.5" fill="#fff" stroke="#1D2B2A" stroke-width="2.5"/><circle cx="49" cy="60" r="2" fill="#1D2B2A"/><circle cx="71" cy="60" r="2" fill="#1D2B2A"/><ellipse cx="60" cy="78" rx="5" ry="6" fill="#1D2B2A"/><path d="M86 46 q4 8 0 10 q-4-2 0-10z" fill="#7CC8F0"/>`,
   confident:`<circle cx="49" cy="61" r="3.2" fill="#1D2B2A"/><circle cx="71" cy="61" r="3.2" fill="#1D2B2A"/><path d="M43 53 h11M66 53 h11" stroke="#1D2B2A" stroke-width="2.6" stroke-linecap="round"/><path d="M48 72 q12 14 24 0z" fill="#fff" stroke="#1D2B2A" stroke-width="3" stroke-linejoin="round"/>`,
   sad:`<circle cx="49" cy="61" r="3.2" fill="#1D2B2A"/><circle cx="71" cy="61" r="3.2" fill="#1D2B2A"/><path d="M43 51 l9 4M77 51 l-9 4" stroke="#1D2B2A" stroke-width="2.6" stroke-linecap="round"/><path d="M50 80 q10-9 20 0" stroke="#1D2B2A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M47 66 q-2 6 0 8 q2-2 0-8z" fill="#7CC8F0"/>`,
   think:`<circle cx="49" cy="60" r="3.2" fill="#1D2B2A"/><circle cx="71" cy="58" r="3.2" fill="#1D2B2A"/><path d="M42 52 h11M66 49 l11 2" stroke="#1D2B2A" stroke-width="2.6" stroke-linecap="round"/><path d="M53 77 q7 -3 14 1" stroke="#1D2B2A" stroke-width="3" fill="none" stroke-linecap="round"/>`
  };
  return (E[expr]||E.neutral)+`<circle cx="42" cy="70" r="5" fill="#F28B82" opacity=".45"/><circle cx="78" cy="70" r="5" fill="#F28B82" opacity=".45"/>`;
}
function hair(style,c){
  switch(style){
    case "bun": return `<circle cx="60" cy="24" r="11" fill="${c}"/><path d="M30 58 q0-32 30-32 q30 0 30 32 q-6-16-30-18 q-24 2-30 18z" fill="${c}"/>`;
    case "long": return `<path d="M28 92 q-4-60 32-64 q36 4 32 64 l-8 0 q2-30-4-40 q-20 4-40 0 q-6 10-4 40z" fill="${c}"/>`;
    case "pony": return `<path d="M30 56 q0-30 30-30 q30 0 30 30 q-10-14-30-14 q-20 0-30 14z" fill="${c}"/><path d="M88 40 q18 6 10 36 q-6-14-12-20z" fill="${c}"/>`;
    case "cap": return `<path d="M30 52 q0-26 30-26 q30 0 30 26z" fill="${c}"/><path d="M86 50 h22 q2 6-6 6 h-16z" fill="${c}"/>`;
    case "side": return `<path d="M30 56 q-2-30 30-30 q32 0 30 28 q-14-12-36-10 q-14 2-24 12z" fill="${c}"/>`;
    default: return `<path d="M31 54 q0-28 29-28 q29 0 29 28 q-8-12-29-12 q-21 0-29 12z" fill="${c}"/>`;
  }
}
function prop(p){
  const P={
    rau:`<path d="M0 0 q-10-18 0-26 q10 8 0 26z" fill="#4CAF50"/><path d="M0 0 q-16-10-14-22 q12 2 14 22z" fill="#2E8B3E"/><path d="M0 0 q16-10 14-22 q-12 2-14 22z" fill="#66BB6A"/>`,
    ca:`<path d="M-16 -8 q16-12 28 0 q-12 12-28 0z" fill="#7FB3D5"/><path d="M12 -8 l9-7 v14z" fill="#5A93BD"/><circle cx="-8" cy="-10" r="1.8" fill="#1D2B2A"/>`,
    taphoa:`<rect x="-14" y="-20" width="28" height="22" rx="3" fill="#D9A066"/><path d="M-14 -12 h28" stroke="#9E6B3A" stroke-width="2"/>`,
    traicay:`<circle cx="-6" cy="-8" r="9" fill="#FF9800"/><circle cx="7" cy="-6" r="8" fill="#E53935"/><path d="M-6 -17 l2-5" stroke="#2E7D32" stroke-width="2.5"/>`,
    quanao:`<path d="M-14 -20 l8-4 q6 5 12 0 l8 4 l-4 9 l-4-2 v15 h-12 v-15 l-4 2z" fill="#EC6FA6"/>`,
    caphe:`<rect x="-9" y="-18" width="18" height="20" rx="3" fill="#fff" stroke="#1D2B2A" stroke-width="2"/><path d="M-9 -12 h18" stroke="#6D4C41" stroke-width="5"/><path d="M9 -12 q8 2 0 9" stroke="#1D2B2A" stroke-width="2" fill="none"/>`,
    banhmi:`<path d="M-18 -4 q18-16 36 0 q-18 8-36 0z" fill="#E0A458"/><path d="M-8 -9 l3 4M0 -11 l3 4M8 -9 l3 4" stroke="#B5762E" stroke-width="2"/>`,
    hoa:`<path d="M0 0 v-16" stroke="#2E7D32" stroke-width="3"/><circle cx="0" cy="-22" r="7" fill="#F06292"/><circle cx="0" cy="-22" r="3" fill="#FFC93C"/>`,
    so:`<rect x="-12" y="-22" width="24" height="28" rx="2" fill="#2F7FD0"/><rect x="-8" y="-18" width="16" height="20" fill="#fff"/><path d="M-5 -13 h10M-5 -8 h10M-5 -3 h7" stroke="#2F7FD0" stroke-width="1.6"/>`,
    hoso:`<rect x="-12" y="-24" width="24" height="30" rx="2" fill="#F5F0E1" stroke="#1D2B2A" stroke-width="2"/><rect x="-5" y="-27" width="10" height="6" rx="2" fill="#5A6B68"/><path d="M-7 -14 h14M-7 -8 h14M-7 -2 h9" stroke="#5A6B68" stroke-width="1.6"/>`,
    phone:`<rect x="-8" y="-22" width="16" height="26" rx="3" fill="#1D2B2A"/><rect x="-6" y="-19" width="12" height="18" fill="#8FD3E8"/>`
  };
  return P[p]||"";
}
function person(o){
  const sk=o.skin||SKIN[0], sh=o.shirt||"#E2453C", pa=o.pants||"#34495E", hc=o.hairColor||"#2B2B2B";
  const nonLa = o.hat==="non" ? `<path d="M12 40 L60 6 L108 40 Q60 48 12 40z" fill="#F3DFA2" stroke="#B8954A" stroke-width="2"/><path d="M36 28 L60 6 L84 28" stroke="#D4B26A" stroke-width="1.5" fill="none"/>` : "";
  const glasses = o.glasses ? `<g fill="none" stroke="#1D2B2A" stroke-width="2.4"><circle cx="49" cy="60" r="8"/><circle cx="71" cy="60" r="8"/><path d="M57 60 h6"/></g>` : "";

function stall(x,y,w,c,closed,goods){
  const n=Math.round(w/40), stripe=w/n;
  let s=`<g transform="translate(${x} ${y})">`;
  s+=`<rect x="6" y="40" width="10" height="260" fill="#6B4E3D"/><rect x="${w-16}" y="40" width="10" height="260" fill="#6B4E3D"/>`;
  for(let i=0;i<n;i++) s+=`<path d="M${i*stripe} 0 h${stripe} v60 q-${stripe/2} 22 -${stripe} 0z" fill="${i%2?"#fff":c}"/>`;
  if(closed){ s+=`<rect x="12" y="64" width="${w-24}" height="236" fill="#9AA7AD"/>`; for(let k=0;k<11;k++) s+=`<path d="M12 ${78+k*20} h${w-24}" stroke="#7E8B91" stroke-width="4"/>`; s+=`<rect x="${w/2-50}" y="150" width="100" height="40" rx="4" fill="#fff"/><text x="${w/2}" y="177" text-anchor="middle" font-family="Be Vietnam Pro,sans-serif" font-weight="700" font-size="20" fill="#C2352B">NGHỈ BÁN</text>`; }
  else {
    s+=`<rect x="0" y="210" width="${w}" height="90" rx="6" fill="#B07A4F"/><rect x="0" y="210" width="${w}" height="16" fill="#8E5E3A"/>`;
    const g=goods||["#FF9800","#E53935","#4CAF50","#FFC93C"];
    for(let i=0;i<Math.floor(w/34);i++){ const cx=22+i*32; s+=`<circle cx="${cx}" cy="${196-(i%2)*8}" r="15" fill="${g[i%g.length]}"/>`; }
    s+=`<rect x="20" y="96" width="${w-40}" height="10" fill="#8E5E3A"/>`;
    for(let i=0;i<Math.floor((w-40)/44);i++) s+=`<rect x="${28+i*44}" y="66" width="30" height="30" rx="4" fill="${g[(i+1)%g.length]}" opacity=".85"/>`;
  }
  return s+`</g>`;
}

const N=CH.length, DUR={mini:16,choose:15,theory:12,quiz:12}, QMAX=60, QMIN=35, TMAX=50, TMIN=30, HMAX=400, MISS={drive:-10,common:-5};

/* ================= ĐIỂM ================= */
const clamp=v=>Math.max(0,Math.min(100,v));
function rawHarmony(s){ const v=STATS.map(x=>s[x.k]); const m=v.reduce((a,b)=>a+b,0)/4; return 600*(0.6*m+0.4*Math.min(...v))/100; }
/* Thang điểm: cách chơi cân bằng nhất có thể đạt đúng HMAX. Tính bằng cách duyệt mọi tổ hợp lựa chọn. */
const BEST_RAW=(function(){
  let best=0; const base={money:50,drive:50,clear:50,common:50};
  const add=(s,d)=>{ const n={...s}; for(const k in d) n[k]=clamp(n[k]+d[k]); return n; };
  (function rec(i,s,flags){
    if(i===N){ best=Math.max(best,rawHarmony(s)); return; }
    let s2=s; if(CH[i].mini) s2=add(s2,{clear:10,drive:5});
    if(CH[i].audit && flags[CH[i].audit.flag]) s2=add(s2,CH[i].audit.d);
    CH[i].choices.forEach(o=>rec(i+1,add(s2,o.d),{cheat:flags.cheat||!!o.cheat,split:flags.split||!!o.split}));
  })(0,base,{});
  return best||1;
})();
function harmony(s){ return Math.min(HMAX,Math.round(HMAX*rawHarmony(s)/BEST_RAW)); }
const quizRight=m=>Object.values(m.quiz||{}).filter(q=>q&&q.p>0).length;

function title(m){
  const h=harmony(m.stats);

  if(m.split) return ["Lách luật bị phát hiện","Tách sạp để né ngưỡng thuế là theo đuổi lợi ích không chính đáng, cuối cùng vẫn bị gộp doanh thu."];
  if(h>=HMAX*0.93) return ["Bậc thầy hài hòa lợi ích","Bạn giữ được cả thu nhập, động lực, minh bạch lẫn lợi ích chung."];
  if(h>=HMAX*0.8) return ["Tiểu thương số hóa","Bạn thích nghi tốt với chính sách mới, chỉ cần cân bằng thêm một chút."];
  if(h>=HMAX*0.63) return ["Còn lấn cấn","Lợi ích của bạn và lợi ích chung vẫn còn lệch nhau."];
  if(m.picks && m.picks[0]===0) return ["Sạp đóng cửa vì tin đồn","Thiếu thông tin đúng khiến động lực và thu nhập đi xuống."];
  const low=STATS.reduce((a,b)=>m.stats[a.k]<=m.stats[b.k]?a:b);
  return (low.k==="clear"||low.k==="common")?["Lợi ích riêng lấn át lợi ích chung","Bạn được lợi trước mắt nhưng lợi ích chung bị bỏ lại phía sau."]:["Mất động lực làm ăn","Thu nhập và động lực đi xuống vì những lựa chọn thiếu cân bằng."];
}

/* ================= KẾT NỐI ================= */
const S={fb:null,base:null,hostUid:null,stateLoaded:false,uid:null,owner:false,state:null,players:[],me:null,ready:false,err:"",forcePlay:location.hash==="#play"};
const seen={};               // phaseKey -> local timestamp when first seen
const key=st=>st?`${st.session}|${st.phase}|${st.round}`:"";
const phaseStart=st=>{const k=key(st); if(!seen[k]) seen[k]=Date.now(); return seen[k];};
const remaining=st=>{ const d=DUR[st.phase]; if(!d) return null; return Math.max(0, d - (Date.now()-phaseStart(st))/1000); };
const isHost=()=>S.owner && !S.forcePlay;
const active=()=>S.state?S.players.filter(p=>p.session===S.state.session):[];
const score=p=>(p.stats?harmony(p.stats):0)+(p.quizPts||0)+(p.thPts||0);
const qTime=p=>{ let t=0; for(let r=0;r<N;r++){ const a=p.th&&p.th[r]; t+= a&&typeof a.t==="number"?a.t:DUR.theory; if(!CH[r].quiz) continue; const q=p.quiz&&p.quiz[r]; t+= q&&typeof q.t==="number"?q.t:DUR.quiz; } return t; };
const ranked=()=>active().slice().sort((a,b)=>score(b)-score(a)||thRight(b)-thRight(a)||quizRight(b)-quizRight(a)||qTime(a)-qTime(b));

const enc=m=>{ const o=JSON.parse(JSON.stringify(m)); ["picks","quiz","th"].forEach(k=>{ const v=o[k]||{}, w={}; Object.keys(v).forEach(r=>w["r"+r]=v[r]); o[k]=w; }); delete o.id; return o; };
const dec=(id,d)=>{ const o={id,...(d||{})}; ["picks","quiz","th"].forEach(k=>{ const v=o[k]||{}, w={}; Object.keys(v).forEach(r=>w[+r.replace(/^r/,"")]=v[r]); o[k]=w; }); o.thPts=o.thPts||0; o.stats=o.stats||{money:50,drive:50,clear:50,common:50}; o.quizPts=o.quizPts||0; return o; };
(async function init(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey || String(cfg.apiKey).includes("DÁN")){ S.err="config"; return render(); }
  try{
    firebase.initializeApp(cfg); S.fb=firebase.database();
    const cred=await firebase.auth().signInAnonymously(); S.uid=cred.user.uid;
  }catch(e){ S.err="auth"; S.errMsg=String(e&&e.message||e); return render(); }
  if(!ROOM){ S.err="landing"; return render(); }
  connectRoom();
})();
function connectRoom(){
  S.err=""; S.base=S.fb.ref("rooms/"+ROOM);
  const t=setTimeout(()=>{ if(!S.ready){ S.err="timeout"; render(); } },12000);
  S.base.child("host").on("value",s=>{
    S.hostUid=s.val(); S.owner=!!S.hostUid && S.hostUid===S.uid;
    if(!S.hostUid){ clearTimeout(t); S.err="noroom"; return render(); }
    if(isHost() && S.stateLoaded && !S.state) setState({session:newSession(),phase:"lobby",round:0});
    if(isHost()) listenReacts();
    if(S.ready) render();
  },()=>{ S.err="timeout"; render(); });
  S.base.child("state").on("value",snap=>{
    clearTimeout(t); S.ready=true; S.stateLoaded=true; if(S.err!=="noroom") S.err="";
    const st=snap.val();
    if(!st && isHost()){ setState({session:newSession(),phase:"lobby",round:0}); return; }
    const prev=S.state; S.state=st; onState(prev,st);
  },()=>{ S.err="timeout"; render(); });
  S.base.child("players").on("value",snap=>{
    const v=snap.val()||{}; S.players=Object.keys(v).map(id=>dec(id,v[id]));
    if(!isHost() && !S.me && S.state && S.uid){ const mine=S.players.find(p=>p.id===S.uid && p.session===S.state.session); if(mine){ S.me=mine; catchUp(S.state); render(); return; } }
    if(isHost()) { hostAuto(); renderHostLive(); }
    else if(S.state && ["answer","final","lobby"].includes(S.state.phase)) render();
  },()=>{});
}
let reactsOn=false;
function listenReacts(){ if(reactsOn) return; reactsOn=true; const ref=S.base.child("reacts"); ref.on("child_added",s=>{ const v=s.val()||{}; if(Date.now()-(v.t||0)<15000) floatReact(v.e); s.ref.remove().catch(()=>{}); }); }
async function createRoom(){
  for(let i=0;i<6;i++){
    const code=String(Math.floor(1000+Math.random()*9000));
    try{ await S.fb.ref("rooms/"+code+"/host").set(S.uid); ROOM=code; try{ localStorage.setItem("snm-host-room",code); }catch(e){} history.replaceState(null,"","?room="+code); return connectRoom(); }catch(e){}
  }
  S.err="auth"; S.errMsg="Không tạo được phòng. Kiểm tra lại luật bảo mật (Rules) của Realtime Database."; render();
}
const newSession=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let writing=Promise.resolve();
function setState(st){ st.at=Date.now(); writing=writing.then(()=>S.base.child("state").set(st)).catch(()=>{}); }
let saving=Promise.resolve();
function saveMe(){ if(!S.base||!S.uid||!S.me) return; const m=S.me; m.harmony=harmony(m.stats); m.score=m.harmony+m.quizPts+(m.thPts||0); const doc=enc(m); saving=saving.then(()=>S.base.child("players/"+S.uid).set(doc)).catch(()=>{ S.err="write"; render(); }); }

/* ================= LUỒNG NGƯỜI CHƠI ================= */
function onState(prev,st){
  if(!st){ return render(); }
  if(!isHost() && S.uid){
    if(!S.me || S.me.session!==st.session){
      const mine=S.players.find(p=>p.id===S.uid && p.session===st.session);
      if(mine) S.me=mine;
      else if(S.me && S.me.session!==st.session){ const {name,av}=S.me; S.me=null; join(name,av); }
    }
    if(S.me) catchUp(st);
  }
  if(prev && prev.phase!==st.phase && isHost()) chime();
  render();
}
function join(name,av){
  const st=S.state; if(!st) return;
  S.me={session:st.session,name:name.slice(0,24),av,joinedAt:Date.now(),joinRound:st.phase==="lobby"?0:(["reveal","quiz","answer"].includes(st.phase)?st.round+1:st.round),
    stats:{money:50,drive:50,clear:50,common:50},picks:{},quiz:{},quizPts:0,th:{},thPts:0,cheat:false,split:false,audited:false,auditedSplit:false,mini:null};
  try{ localStorage.setItem("snm-profile",JSON.stringify({name,av})); }catch(e){}
  catchUp(st); saveMe(); render();
}
function apply(d){ const s=S.me.stats; for(const k in d) s[k]=clamp(s[k]+d[k]); }
function catchUp(st){
  const m=S.me; let changed=false; const after=["reveal","quiz","answer"].includes(st.phase)||st.phase==="final";
  for(let r=m.joinRound;r<N;r++){
    const passed = r<st.round || (r===st.round && after) || st.phase==="final";
    if(!passed) break;
    if(m.picks[r]===undefined){ m.picks[r]=-1; apply(MISS); changed=true; }
  }
  const reached=r=>st.round>r||(st.round===r&&st.phase!=="lobby")||st.phase==="final";
  if(m.cheat && !m.audited && reached(2)){ m.audited=true; apply(CH[2].audit.d); changed=true; S.notice={k:key(st),t:CH[2].audit.t,d:CH[2].audit.d}; }
  if(m.split && !m.auditedSplit && reached(3)){ m.auditedSplit=true; apply(CH[3].audit.d); changed=true; S.notice={k:key(st),t:CH[3].audit.t,d:CH[3].audit.d}; }
  if(changed) saveMe();
}

/* ================= HOST ================= */
function hostNext(){
  const st=S.state; if(!st) return; const r=st.round, c=CH[r];
  const go=(phase,round=r)=>setState({session:st.session,phase,round});
  switch(st.phase){
    case "lobby": return go("scene",0);
    case "scene": return go(c.mini?"mini":"choose");
    case "mini": return go("choose");
    case "choose": return go("reveal");
    case "reveal": return go("theory");
    case "theory": return go("tanswer");
    case "tanswer": return c.quiz?go("quiz"):(r+1<N?go("scene",r+1):go("final"));
    case "quiz": return go("answer");
    case "answer": return r+1<N?go("scene",r+1):go("final");
  }
}
let autoKey="";
function hostAuto(){
  const st=S.state; if(!st||!isHost()) return; const k=key(st); if(autoKey===k) return;
  const rem=remaining(st); const pl=active();
  let done=false;
  if(st.phase==="choose") done=pl.length>0 && pl.every(p=>p.picks && p.picks[st.round]!==undefined);
  if(st.phase==="quiz") done=pl.length>0 && pl.every(p=>p.quiz && p.quiz[st.round]!==undefined);
  if(st.phase==="theory") done=pl.length>0 && pl.every(p=>p.th && p.th[st.round]!==undefined);
  if((rem!==null && rem<=0) || done){ autoKey=k; setTimeout(hostNext, done&&rem>0?900:200); }
}

const ITEMS=[["Mì gói 1 thùng","120.000đ"],["Nước mắm 2 chai","86.000đ"],["Gạo 5 kg","95.000đ"],["Dầu ăn 1 lít","52.000đ"],["Sữa 1 lốc","34.000đ"],["Đường 2 kg","48.000đ"],["Bột giặt 3 kg","135.000đ"],["Trứng 1 vỉ","38.000đ"],["Nước ngọt 1 lốc","72.000đ"],["Cà phê 1 bịch","65.000đ"]];
let miniRun=null;
function startMini(st){
  if(miniRun && miniRun.k===key(st)) { miniRun.rebind(); return; }
  const r=st.round; let spawned=0, got=0; const k=key(st);
  const spawn=()=>{ const sg=document.getElementById("sg"); if(!sg) return; const free=[...Array(9).keys()].filter(i=>!document.getElementById("s"+i).firstChild); if(!free.length) return;
    const i=free[Math.floor(Math.random()*free.length)], it=ITEMS[Math.floor(Math.random()*ITEMS.length)]; spawned++;
    const b=document.createElement("button"); b.className="cust"; b.innerHTML=`${esc(it[0])}<br><small>${esc(it[1])}</small>`;
    b.onclick=()=>{ if(b.classList.contains("done")) return; b.classList.add("done"); b.textContent="✓"; got++; const mc=document.getElementById("mc"); if(mc) mc.textContent=`Đã ghi ${got} đơn`; setTimeout(()=>b.remove(),300); };
    document.getElementById("s"+i).appendChild(b); setTimeout(()=>{ if(b.isConnected&&!b.classList.contains("done")) b.remove(); },1700); };
  const end=()=>{ clearInterval(iv); clearTimeout(to); if(S.me.mini&&S.me.mini.r===r) return; const acc=spawned?got/spawned:0, d={clear:Math.round(acc*10),drive:acc>=.7?5:-5}; apply(d); S.me.mini={r,got,spawned,d}; miniRun=null; saveMe(); renderPlayer(); };
  const iv=setInterval(spawn,1100); spawn();
  const to=setTimeout(end, Math.max(1000,(remaining(st)-0.5)*1000));

}

setInterval(()=>{
  const st=S.state; if(!st) return; const rem=remaining(st);
  document.querySelectorAll("[data-ring]").forEach(svg=>{ if(rem===null) return; const f=rem/DUR[st.phase]; svg.querySelector(".rf").setAttribute("stroke-dashoffset",String(169.6*(1-f))); svg.querySelector(".rt").textContent=Math.ceil(rem); });
  if(isHost()) hostAuto();
  if(!isHost() && S.me && miniRun && st.phase!=="mini") miniRun.end();
  if(!isHost() && S.me && st.phase==="mini" && !(S.me.mini&&S.me.mini.r===st.round) && !miniRun && document.getElementById("sg")) startMini(st);
},250);

/* ---------- SOUND (host only) ---------- */
let actx=null, mt=null;
function ac(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return actx; }
function note(f,t,d,v=.05,type="square"){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d); }
const MEL=[523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,587];
function startMusic(){ const a=ac(); if(!a) return; let i=0; stopMusic(); mt=setInterval(()=>{ const t=a.currentTime+.02; note(MEL[i%MEL.length],t,.22,.03); if(i%4===0) note(MEL[i%MEL.length]/4,t,.4,.04,"triangle"); i++; },260); }
function stopMusic(){ if(mt) clearInterval(mt); mt=null; }
function chime(){ if(!music) return; const a=ac(); if(!a) return; const t=a.currentTime; [784,988,1319].forEach((f,i)=>note(f,t+i*.09,.25,.06,"triangle")); }
})();
